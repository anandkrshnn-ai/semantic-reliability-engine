name: CI & Benchmark Integrity

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests, Provenance Verification & Benchmark Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt

      - name: Run Test Suite (128 Tests)
        run: |
          pytest tests/ -v

      - name: Mechanical Provenance & Citation Audit
        run: |
          python -m semantic_reliability.cli audit-provenance --target-dir examples/assertions --audit-citations paper/main.tex --strict
          python -m semantic_reliability.cli audit-provenance --target-dir benchmark_corpus --strict

      - name: Execute Dual-Track Benchmark & Protocol Verifier
        run: |
          python -m semantic_reliability.cli benchmark-corpus --split all --error-analysis --json-out ci_benchmark_results.json

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ci_benchmark_results.json

