metric: net_revenue
description: Recognized revenue minus refunds for active enterprise customers
owner: finance
grain: customer_month
dialect: postgres
tags:
  - financial_contract
  - tier_1
invariants:
  population:
    required_filters:
      - "status = 'active'"
      - "region = 'NA'"
  grain:
    required_dimensions:
      - customer_id
      - "date_trunc('month', transaction_date)"
  aggregation:
    required_function: SUM
    positive_components:
      - "type = 'invoice'"
    negative_components:
      - "type = 'refund'"
  units:
    currency: USD
    scale: standard
  time:
    timezone: UTC
    period_grain: calendar_month
sql: |
  SELECT
    customer_id,
    DATE_TRUNC('month', transaction_date) AS reporting_month,
    SUM(CASE WHEN type = 'invoice' THEN amount ELSE 0 END) -
    SUM(CASE WHEN type = 'refund' THEN amount ELSE 0 END) AS net_revenue
  FROM transactions
  WHERE region = 'NA' AND status = 'active'
  GROUP BY customer_id, DATE_TRUNC('month', transaction_date)
