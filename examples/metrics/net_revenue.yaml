metric: net_revenue
description: Recognized revenue minus refunds and chargebacks for active enterprise customers in North America
owner: finance
grain: customer_month
dialect: postgres
tags:
  - tier_1_financial
  - executive_kpi
dimensions:
  - customer_id
  - plan_tier
  - billing_country
sql: |
  SELECT
    customer_id,
    DATE_TRUNC('month', transaction_date) AS reporting_month,
    SUM(CASE WHEN type = 'invoice' THEN amount ELSE 0 END) -
    SUM(CASE WHEN type = 'refund' THEN amount ELSE 0 END) AS net_revenue
  FROM transactions
  WHERE region = 'NA' AND status = 'active'
  GROUP BY customer_id, DATE_TRUNC('month', transaction_date)
