version: '3.8'

services:
  scos-mcp-server:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    container_name: scos_mcp_server
    command: sre mcp-serve --contracts benchmark_corpus/dev --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  analytics-agent-demo:
    build:
      context: ..
      dockerfile: demo/Dockerfile
    container_name: analytics_agent_demo
    depends_on:
      - scos-mcp-server
    command: python demo/agent.py --server-url http://scos-mcp-server:8000
    environment:
      - PYTHONUNBUFFERED=1
