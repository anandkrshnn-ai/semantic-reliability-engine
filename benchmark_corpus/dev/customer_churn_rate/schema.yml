# Provenance:
#   Repository: https://github.com/fivetran/dbt_stripe
#   Organization: Fivetran
#   Reference: models/stripe_models.yml (subscription / churn metrics)

version: 2
models:
- name: model_customer_churn_rate
  columns:
  - name: plan
    tests:
    - not_null
    - accepted_values:
        values: ['starter', 'pro', 'enterprise']
  - name: churn_rate
    tests:
    - not_null
    - accepted_range:
        min_value: 0.0
        max_value: 1.0

